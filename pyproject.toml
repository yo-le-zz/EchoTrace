[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "echotrace"
dynamic = ["version"]
description = "Desktop OSINT correlation engine working on public data only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yolezz" }]
keywords = ["osint", "username", "correlation", "pyqt6", "reports"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "PyQt6>=6.6",
    "aiohttp>=3.9",
    "beautifulsoup4>=4.12",
    "certifi>=2024.2.2",
    "Jinja2>=3.1",
    "Pillow>=10.0",
    "platformdirs>=4.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
# Détection de visages (comptage uniquement) dans le module image.
image = ["opencv-python-headless>=4.8"]

[project.gui-scripts]
echotrace = "echotrace.app:main"

[project.scripts]
echotrace-cli = "echotrace.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.version]
path = "src/echotrace/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/echotrace"]

[tool.hatch.build.targets.sdist]
include = ["src/echotrace", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# B904 est trop bruyant pour du code Qt/asyncio de ce type.
ignore = ["B904"]

[tool.ruff.lint.per-file-ignores]
# Modèle HTML : de longues lignes de balisage sont normales.
"src/echotrace/reports/html_template.py" = ["E501"]
